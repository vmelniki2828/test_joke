services:
  # 1. Nginx Proxy Manager (теперь он главный на входе)
  nginx-proxy-manager:
    image: 'jc21/nginx-proxy-manager:latest'
    container_name: my-npm
    restart: always
    ports:
      - '80:80'    # HTTP
      - '443:443'  # HTTPS (для замочка)
      - '81:81'    # Админка NPM
    volumes:
      - ./npm_data:/data
      - ./npm_letsencrypt:/etc/letsencrypt

  # 2. Твой веб-сайт (убираем порты, он будет работать внутри сети Docker)
  web-server:
    image: nginx:latest
    container_name: my-web-site
    # ports: - "80:80"  <-- ЭТО УДАЛЯЕМ, порт 80 уже занят NPM
    volumes:
      - ./index.html:/usr/share/nginx/html/index.html:ro
      - ./custom_nginx.conf:/etc/nginx/conf.d/default.conf:ro
    restart: always
    depends_on:
      - db

  # 3. База данных
  db:
    image: postgres:15
    container_name: my-postgres-db
    environment:
      POSTGRES_USER: dev_user
      POSTGRES_PASSWORD: mysecretpassword
      POSTGRES_DB: my_project_db
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    restart: always

  # 4. Админка БД
  adminer:
    image: adminer
    container_name: my-adminer
    restart: always
    ports:
      - "8080:8080"

  # 5. Управление Docker
  portainer:
    image: portainer/portainer-ce:latest
    container_name: my-portainer
    restart: always
    ports:
      - "9000:9000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data

volumes:
  db_data:
  portainer_data:
  # npm_data и npm_letsencrypt можно не объявлять, если используешь локальные папки ./